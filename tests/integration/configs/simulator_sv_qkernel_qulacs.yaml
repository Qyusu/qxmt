description: "This is an integration test for running an experiment by the state vector simulator (Qulacs)."

global_settings:
  random_seed: &global_seed 42
  model_type: "qkernel"
  task_type: "classification"

dataset:
  generate:
    generate_method: "linear"
    params: {
      "n_samples": 1000,
      "n_features": 2,
      "n_classes": 3,
    }
  split:
    train_ratio: 0.8
    validation_ratio: 0.1
    test_ratio: 0.1
    shuffle: true
  features: null
  raw_preprocess_logic:
    module_name: "qxmt.datasets.raw_preprocess.sampling"
    implement_name: "sample_n_per_class"
    params:
      n_samples: 100
      labels: [0, 1, 2]
      random_seed: *global_seed
  transform_logic:
    module_name: "qxmt.datasets.transform.reducer"
    implement_name: "dimension_reduction_by_pca"
    params:
      n_components: 2
      random_seed: *global_seed

device:
  platform: "qulacs"
  device_name: "cpu.simulator"
  n_qubits: 2
  shots: null
  device_options: null

feature_map:
  module_name: "qxmt.feature_maps.qulacs"
  implement_name: "ZZFeatureMap"
  params:
    reps: 2

kernel:
  module_name: "qxmt.kernels.qulacs"
  implement_name: "FidelityKernel"
  params: {}

model:
  name: "qsvc"
  params:
    C: 1.0
    gamma:  "scale"

evaluation:
  default_metrics:
  - "accuracy"
  - "precision"
  - "recall"
  - "f1_score"
  custom_metrics: []
