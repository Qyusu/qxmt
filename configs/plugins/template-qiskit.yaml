description: "This is a template configuration file using Qiskit."

global_settings:
  random_seed: &global_seed 42
  model_type: "qkernel"
  task_type: "classification"

dataset:
  openml:
    name: "mnist_784"
    id: 554
    return_format: "numpy"
    save_path: "data/openml/mnist_784/dataset.npy"
  split:
    train_ratio: 0.8
    validation_ratio: 0.0
    test_ratio: 0.2
    shuffle: true
  features: null
  raw_preprocess_logic:
    module_name: "qxmt.datasets.raw_preprocess.sampling"
    implement_name: "sample_n_per_class"
    params:
      n_samples: 100
      labels: [0, 1]
      random_seed: *global_seed
  transform_logic:
    module_name: "qxmt.datasets.transform.reducer"
    implement_name: "dimension_reduction_by_pca"
    params:
      n_components: 2
      random_seed: *global_seed

device:
  platform: "qiskit"
  device_name: "statevector"
  n_qubits: 2
  shots: null
  device_options:
    seed_simulator: *global_seed

feature_map:
  module_name: "qxmt.feature_maps.qiskit"
  implement_name: "ZZFeatureMap"
  params:
    reps: 2

kernel:
  module_name: "qxmt.kernels.qiskit"
  implement_name: "ProjectedKernel"
  params:
    gamma: 1.0
    projection: "z"

model:
  name: "qsvc"
  params:
    C: 1.0
    gamma: "scale"

evaluation:
  default_metrics:
  - "accuracy"
  - "precision"
  - "recall"
  - "f1_score"
  custom_metrics: []
